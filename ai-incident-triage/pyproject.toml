[project]
name = "ai-incident-triage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayush Srivastava", email = "ayush.srivastava04@nagarro.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.3",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langsmith>=0.10.15",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "typer>=0.27.1",
]

[project.scripts]
ai-incident-triage = "ai_incident_triage:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
